name: Java CI with Maven + SonarQube

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run Tests
      run: mvn test

    - name: SonarQube Analysis
      run: mvn -f pom.xml \
        -Dsonar.projectKey=TimesToUTC \
        -Dsonar.host.url=http://189.146.51.217:9000 \
        -Dsonar.login=${{ secrets.SONARQUBE_TOKEN }} \
        sonar:sonar

    - name: SonarQube Quality Gate
      id: qualitygate
      uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
      with:
        sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
        sonar_host_url: http://189.146.51.217:9000

    - name: Check Quality Gate
      if: steps.qualitygate.outputs.projectStatus != 'OK'
      run: |
        echo "Quality Gate failed: ${{ steps.qualitygate.outputs.projectStatus }}"
        exit 1

    - name: Export SonarQube Issues
      run: |
        curl -u ${{ secrets.SONARQUBE_TOKEN }}: \
          "http://189.146.51.217:9000/api/issues/search?projectKeys=my-java-project" \
          -o sonar-issues.json
      continue-on-error: true

    - name: Upload SonarQube Issues
      uses: actions/upload-artifact@v4
      with:
        name: sonar-issues
        path: sonar-issues.json
